<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZEE HUB - Online Shopping</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            ZEE HUB
        </div>

        <button onclick="openCart()">
            🛒 Cart <span id="cartCount">0</span>
        </button>

    </header>


    <!-- HERO -->
    <section class="hero">

        <div>

            <p>WELCOME TO</p>

            <h1>
                ZEE HUB
            </h1>

            <h2>
                Shop Everything You Love
            </h2>

            <a href="#products">
                SHOP NOW
            </a>

        </div>

    </section>


    <!-- CATEGORIES -->
    <section class="categories">

        <h2>
            Categories
        </h2>

        <div class="category-list">

            <button onclick="displayProducts()">
                All
            </button>

            <button>
                Fashion
            </button>

            <button>
                Electronics
            </button>

            <button>
                Home
            </button>

            <button>
                Beauty
            </button>

            <button>
                Accessories
            </button>

        </div>

    </section>


    <!-- PRODUCTS -->
    <section class="products-section">

        <div class="section-title">

            <h2>
                Popular Products
            </h2>

            <input
                type="search"
                id="search"
                placeholder="Search products..."
                oninput="searchProducts()"
            >

        </div>


        <!-- PRODUCTS WILL APPEAR HERE -->
        <div
            id="products"
            class="product-grid">
        </div>

    </section>


    <!-- CART OVERLAY -->
    <div
        id="cartOverlay"
        class="overlay"
        onclick="closeCart()">
    </div>


    <!-- CART -->
    <aside
        id="cart"
        class="cart">

        <div class="cart-header">

            <h2>
                Your Cart
            </h2>

            <button onclick="closeCart()">
                ✕
            </button>

        </div>


        <div id="cartItems">
        </div>


        <div class="cart-bottom">

            <h3>
                Total:
                ₹<span id="cartTotal">0</span>
            </h3>

            <button onclick="checkout()">
                ORDER ON WHATSAPP
            </button>

        </div>

    </aside>


    <!-- FOOTER -->
    <footer>

        <h2>
            ZEE HUB
        </h2>

        <p>
            Quality products. Great prices.
        </p>

        <p>
            © 2026 ZEE HUB
        </p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
